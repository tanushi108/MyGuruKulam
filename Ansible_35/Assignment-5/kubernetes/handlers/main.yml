---
# handlers file for kubernetes

- name: Restart kubelet
  ansible.builtin.systemd:
    name: "{{ kubernetes_service }}"
    state: restarted
    daemon_reload: true



- name: Restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true